<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<title>Taha'nın Haftalık Programı</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#14213d;--mute:#6b7690;--line:#dde2ec;--red:#c8102e;--kurs:#2457d6;--spor:#1c8a56;--diger:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#172038;--ink:#eef1f8;--mute:#8e9ab5;--line:#26314d;--kurs:#6c93ff;--spor:#43c38a;--diger:#e3a948;--red:#ff5a73}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 'Bricolage Grotesque',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 14px calc(env(safe-area-inset-bottom,0px) + 90px)}
main{max-width:640px;margin:0 auto}
header{padding:22px 2px 10px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:14px;margin-top:2px}
.prog{margin:14px 0 4px;height:8px;background:var(--line);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--red);width:0;transition:width .3s}
.pt{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
nav{display:flex;gap:8px;align-items:center;margin:16px 0 8px}
nav b{flex:1;text-align:center;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
.nb{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px}
.day{margin:10px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.day.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.dh{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.dh span{color:var(--mute);font-weight:400;font-size:14px;margin-left:6px}
.add{border:0;background:none;color:var(--mute);font-size:24px;line-height:1;padding:0 6px}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;font-size:14px;color:#fff}
.it.done .ck{background:var(--spor);border-color:var(--spor)}
.it.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1;min-width:0;cursor:pointer}
.tag{font-size:12px;font-weight:600;padding:2px 8px;border-radius:9px;border:1px solid currentColor}
.kurs{color:var(--kurs)}.spor{color:var(--spor)}.diger{color:var(--diger)}
.empty{color:var(--mute);font-size:14px;padding:6px 0 2px}
.sec{margin:22px 2px 0;font-weight:600}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:10px;align-items:center;justify-content:center}
#st{font-size:13px;color:var(--mute);flex:1;max-width:300px}
.fab{background:var(--red);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600}
dialog{border:0;border-radius:16px;padding:18px;width:min(92vw,420px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;margin-top:18px}
.row button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:none}
.row .ok{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.row .del{color:var(--red)}
.hint{font-size:13px;color:var(--mute);margin:8px 0 0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<main>
<header>
  <h1>Behlül Taha Hendekci</h1>
  <div class="sub">YTÜ · Dijital pazarlama eğitimi · haftalık program</div>
  <div class="prog"><i id="pb"></i></div>
  <div class="pt"><span id="pl"></span><span id="pp"></span></div>
</header>
<nav>
  <button class="nb" id="prev" aria-label="Önceki hafta">‹</button>
  <b id="wl"></b>
  <button class="nb" id="today">Bugün</button>
  <button class="nb" id="next" aria-label="Sonraki hafta">›</button>
</nav>
<div id="days"></div>
<div id="undated"></div>
</main>

<div id="bar">
  <span id="st">…</span>
  <button class="nb" id="cfgBtn">Ayarlar</button>
  <button class="fab" id="newBtn">+ Ekle</button>
</div>

<dialog id="dlg">
  <b id="dt">Yeni kayıt</b>
  <label for="f-title">Başlık</label><input id="f-title" autocomplete="off">
  <label for="f-date">Tarih (boş bırakırsan "günü belirsiz" olur)</label><input id="f-date" type="date">
  <label for="f-type">Tür</label>
  <select id="f-type"><option value="kurs">Kurs</option><option value="spor">Spor</option><option value="diger">Diğer</option></select>
  <div class="row"><button id="f-del" class="del">Sil</button><button id="f-cancel">Vazgeç</button><button id="f-ok" class="ok">Kaydet</button></div>
</dialog>

<dialog id="cfgDlg">
  <b>GitHub bağlantısı</b>
  <p class="hint">Telefondan yaptığın değişiklikler data.json dosyasına kaydedilir. Token yalnızca bu cihazın tarayıcısında durur.</p>
  <label for="c-repo">Repo (kullanıcı/repo)</label><input id="c-repo" placeholder="kullaniciadi/program" autocomplete="off">
  <label for="c-branch">Branch</label><input id="c-branch" placeholder="main" autocomplete="off">
  <label for="c-token">Token (fine-grained, Contents: Read and write)</label><input id="c-token" type="password" autocomplete="off">
  <div class="row"><button id="c-cancel">Vazgeç</button><button id="c-ok" class="ok">Kaydet</button></div>
</dialog>

<script>
const $=id=>document.getElementById(id);
const DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MON=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=d=>d.getDate()+' '+MON[d.getMonth()];

// İlk açılış verisi (data.json yoksa bu kullanılır)
const DEF={meta:{watched:7},items:[
 ['Dijital Kampanya Yönetimi – Yasemin Ayna','2026-10-04'],
 ['Google Reklamları (Google Ads) – Erdem Kaya','2026-10-07'],
 ['Google Ads Workshop – Erdem Kaya','2026-10-09'],
 ['Stratejik Pazarlama Yönetimi – Melis Erdoğan','2026-10-11'],
 ['Kreatif Süreçler ve Ajans-Müşteri İlişkileri – Bengisu Gençay','2026-10-14'],
 ['Uygulamalı SEO Teknikleri – Şerza Saka','2026-10-16'],
 ['Growth Hacking ve Marketing – Asya Naz Konukseven','2026-10-18']
].map((a,i)=>({id:'k'+(8+i),title:(8+i)+'. '+a[0],date:a[1],type:'kurs',done:false}))};

let S=DEF,sha=null,wk=monday(new Date()),editId=null,chain=Promise.resolve();
let cfg={};try{cfg=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
const setSt=t=>$('st').textContent=t;
const api=()=>`https://api.github.com/repos/${cfg.repo}/contents/data.json`;
const hdr=()=>({Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'});
const br=()=>cfg.branch||'main';
const b64=s=>btoa(unescape(encodeURIComponent(s)));
const unb64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
const linked=()=>cfg.repo&&cfg.token;

async function load(){
  try{
    if(linked()){
      const r=await fetch(`${api()}?ref=${br()}&t=${Date.now()}`,{headers:hdr(),cache:'no-store'});
      if(r.status===404){sha=null;setSt('Henüz data.json yok, ilk kayıtta oluşturulacak')}
      else if(r.ok){const j=await r.json();sha=j.sha;S=JSON.parse(unb64(j.content));setSt('GitHub ile senkron ✓')}
      else throw new Error(r.status);
    }else{
      const r=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
      if(r.ok){S=await r.json();setSt('Salt okunur (Ayarlar\'dan token ekle)')}
      else setSt('Salt okunur (Ayarlar\'dan token ekle)');
    }
  }catch(e){
    try{const c=localStorage.getItem('cache');if(c)S=JSON.parse(c)}catch(_){}
    setSt('Bağlantı sorunu, yerel kopya gösteriliyor');
  }
  render();
}

function save(){
  try{localStorage.setItem('cache',JSON.stringify(S))}catch(e){}
  render();
  if(!linked()){setSt('Sadece bu cihazda kayıtlı. Ayarlar\'dan GitHub token ekle.');return}
  setSt('Kaydediliyor…');
  const snap=JSON.stringify(S,null,2)+'\n';
  chain=chain.then(async()=>{
    try{
      const g=await fetch(`${api()}?ref=${br()}&t=${Date.now()}`,{headers:hdr(),cache:'no-store'});
      sha=g.ok?(await g.json()).sha:null;
      const body={message:'Program güncellendi',content:b64(snap),branch:br()};
      if(sha)body.sha=sha;
      const r=await fetch(api(),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!r.ok)throw new Error(r.status);
      sha=(await r.json()).content.sha;setSt('GitHub\'a kaydedildi ✓');
    }catch(e){setSt('Kaydedilemedi ('+e.message+'). Token ve repo ayarını kontrol et.')}
  });
}

function itemEl(it){
  const d=document.createElement('div');d.className='it'+(it.done?' done':'');
  const c=document.createElement('button');c.className='ck';c.textContent=it.done?'✓':'';c.setAttribute('aria-label','Tamamlandı işaretle');
  c.onclick=()=>{it.done=!it.done;save()};
  const t=document.createElement('div');t.className='t';t.textContent=it.title;t.onclick=()=>openDlg(it.id);
  const g=document.createElement('span');g.className='tag '+it.type;g.textContent={kurs:'Kurs',spor:'Spor',diger:'Diğer'}[it.type];
  d.append(c,t,g);return d;
}

function render(){
  const days=$('days');days.innerHTML='';
  const end=new Date(wk);end.setDate(end.getDate()+6);
  $('wl').textContent=fmt(wk)+' – '+fmt(end);
  const todayIso=iso(new Date());
  for(let i=0;i<7;i++){
    const d=new Date(wk);d.setDate(d.getDate()+i);const k=iso(d);
    const box=document.createElement('section');box.className='day'+(k===todayIso?' today':'');
    box.innerHTML=`<div class="dh"><div>${DAYS[d.getDay()]}<span>${fmt(d)}</span></div><button class="add" aria-label="Ekle">+</button></div>`;
    box.querySelector('.add').onclick=()=>openDlg(null,k);
    const list=S.items.filter(x=>x.date===k);
    if(!list.length){const e=document.createElement('div');e.className='empty';e.textContent='Boş gün';box.append(e)}
    list.forEach(x=>box.append(itemEl(x)));
    days.append(box);
  }
  const un=S.items.filter(x=>!x.date),u=$('undated');u.innerHTML='';
  if(un.length){const h=document.createElement('div');h.className='sec';h.textContent='Günü belirsiz';u.append(h);
    const box=document.createElement('section');box.className='day';un.forEach(x=>box.append(itemEl(x)));u.append(box)}
  const kurs=S.items.filter(x=>x.type==='kurs'),dn=kurs.filter(x=>x.done).length;
  const w=S.meta?.watched||0,tot=w+kurs.length,cur=w+dn;
  $('pb').style.width=(tot?cur/tot*100:0)+'%';
  $('pl').textContent=`Kurs ${cur} / ${tot} izlendi`;
  $('pp').textContent=kurs.length-dn?`${kurs.length-dn} kurs kaldı`:'Hepsi bitti 🎉';
}

function openDlg(id,date){
  editId=id;const it=S.items.find(x=>x.id===id);
  $('dt').textContent=it?'Kaydı düzenle':'Yeni kayıt';
  $('f-title').value=it?it.title:'';
  $('f-date').value=it?it.date:(date??iso(new Date()));
  $('f-type').value=it?it.type:'spor';
  $('f-del').style.display=it?'':'none';
  $('dlg').showModal();
}
$('f-ok').onclick=()=>{
  const title=$('f-title').value.trim();if(!title){$('f-title').focus();return}
  const v={title,date:$('f-date').value,type:$('f-type').value};
  if(editId){Object.assign(S.items.find(x=>x.id===editId),v)}
  else S.items.push({id:'i'+Date.now(),done:false,...v});
  if(v.date)wk=monday(parse(v.date));
  $('dlg').close();save();
};
$('f-del').onclick=()=>{if(confirm('Bu kayıt silinsin mi?')){S.items=S.items.filter(x=>x.id!==editId);$('dlg').close();save()}};
$('f-cancel').onclick=()=>$('dlg').close();
$('newBtn').onclick=()=>openDlg(null);

$('prev').onclick=()=>{wk.setDate(wk.getDate()-7);render()};
$('next').onclick=()=>{wk.setDate(wk.getDate()+7);render()};
$('today').onclick=()=>{wk=monday(new Date());render()};

$('cfgBtn').onclick=()=>{$('c-repo').value=cfg.repo||'';$('c-branch').value=cfg.branch||'main';$('c-token').value=cfg.token||'';$('cfgDlg').showModal()};
$('c-cancel').onclick=()=>$('cfgDlg').close();
$('c-ok').onclick=()=>{
  cfg={repo:$('c-repo').value.trim(),branch:$('c-branch').value.trim()||'main',token:$('c-token').value.trim()};
  localStorage.setItem('cfg',JSON.stringify(cfg));$('cfgDlg').close();load();
};

load();
</script>
</body>
</html>
